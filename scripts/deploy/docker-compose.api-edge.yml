services:
  api-edge:
    image: ${CADDY_IMAGE:?Pin the tested Caddy image digest}
    container_name: writer-agent-api-edge
    network_mode: host
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    environment:
      WRITER_AGENT_API_DOMAIN: ${WRITER_AGENT_API_DOMAIN:?Set the API hostname}
    volumes:
      - /etc/writer-agent/Caddyfile:/etc/caddy/Caddyfile:ro
      - /var/lib/writer-agent-caddy/data:/data
      - /var/lib/writer-agent-caddy/config:/config
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
