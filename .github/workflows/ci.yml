name: CI

on:
  push:
    # Development branches are verified by pull_request, once publication is authorized.
    branches: [main]
  pull_request:
    branches: [main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    name: Typecheck, Lint & Test
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: apps/api-go/go.sum
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build contracts
        run: pnpm --filter @writer-agent/contracts build
      - name: OpenAPI reproducibility
        run: pnpm openapi:check
      - name: Reply style reproducibility and offline eval
        run: pnpm style:check && pnpm test:style
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Go unit tests
        run: go test -C apps/api-go -timeout 90s ./...
      - name: Agent reliability unit tests and offline eval
        run: pnpm test:agent && pnpm eval:reliability
      - name: Agent recovery process integration
        run: pnpm test:thinking
      - name: Web unit tests
        run: pnpm --filter @writer-agent/web test
