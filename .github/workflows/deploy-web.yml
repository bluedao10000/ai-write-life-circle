name: Deploy Web → Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - '.github/workflows/deploy-web.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      # Tests and documentation still receive the complete CI check.
      - '!apps/web/**/*.md'
      - '!apps/web/e2e/**'
      - '!apps/web/src/test/**'
      - '!apps/web/playwright*.ts'
      - '!apps/web/vitest*.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: writer-agent-production-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy to Cloudflare Pages

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm --filter @writer-agent/web build
        env:
          NODE_ENV: production
          VITE_WRITER_AGENT_MODE: api
          VITE_WRITER_AGENT_PROJECT_ID: local
          VITE_STORY2U_PUBLIC_SITE: true
          VITE_WRITER_AGENT_AUTH: google

      - name: Require compatible public and per-user identity API before switching web entry
        env:
          WRITER_AGENT_API_TOKEN: ${{ secrets.WRITER_AGENT_API_TOKEN }}
        run: |
          node --input-type=module - <<'JS'
          import { publicHomeSchema } from './packages/contracts/dist/index.js'
          const response = await fetch('https://api.story2u.xyz/v1/public/home', { signal: AbortSignal.timeout(15000), redirect: 'error' })
          if (!response.ok) throw new Error('Deploy the publication Go API before the public web entry')
          publicHomeSchema.parse(await response.json())
          // Sign-up is open: never switch the web entry to an API that would map
          // every Google account onto one shared author.
          if (response.headers.get('x-writer-agent-identity-mode') !== 'per-user-v1') throw new Error('Deploy the per-user identity Go API (WRITER_AGENT_IDENTITY_PUBLIC_KEY) before this web entry')
          if(!process.env.WRITER_AGENT_API_TOKEN) throw new Error('Missing API credential for managed workspace preflight')
          // A bearer without a signed user must be refused by the per-user API.
          const managed = await fetch('https://api.story2u.xyz/v1/studio/books', { headers: { authorization: `Bearer ${process.env.WRITER_AGENT_API_TOKEN}` }, signal: AbortSignal.timeout(15000), redirect: 'error' })
          await managed.body?.cancel()
          if (managed.status !== 401) throw new Error('Go API accepted a request without a signed user (status ' + managed.status + ')')
          JS

      - name: Prepare persistent authentication database
        run: node scripts/prepare-auth-deploy.mjs
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}

      - name: Validate login configuration
        shell: bash
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          WRITER_AGENT_IDENTITY_PRIVATE_KEY: ${{ secrets.WRITER_AGENT_IDENTITY_PRIVATE_KEY }}
          WRITER_AGENT_API_TOKEN: ${{ secrets.WRITER_AGENT_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import os,sys
          names=['BETTER_AUTH_SECRET','GOOGLE_CLIENT_ID','GOOGLE_CLIENT_SECRET','WRITER_AGENT_IDENTITY_PRIVATE_KEY','WRITER_AGENT_API_TOKEN']
          missing=[name for name in names if not os.environ.get(name,'').strip()]
          if missing:
              print('Missing GitHub Actions configuration: '+', '.join(missing),file=sys.stderr)
              sys.exit(1)
          PY

      - name: Apply additive authentication schema
        run: pnpm exec wrangler d1 migrations apply story2u-auth --remote --config wrangler.auth.generated.toml
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy worker and runtime secrets together
        run: |
          set -euo pipefail
          secret_file=$(mktemp)
          trap 'rm -f "$secret_file"' EXIT
          chmod 600 "$secret_file"
          python3 -c 'import os,json; names=["BETTER_AUTH_SECRET","GOOGLE_CLIENT_ID","GOOGLE_CLIENT_SECRET","WRITER_AGENT_IDENTITY_PRIVATE_KEY","WRITER_AGENT_API_TOKEN"]; print(json.dumps({n:os.environ[n] for n in names}))' > "$secret_file"
          pnpm exec wrangler deploy --config wrangler.auth.generated.toml --secrets-file "$secret_file"
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          WRITER_AGENT_IDENTITY_PRIVATE_KEY: ${{ secrets.WRITER_AGENT_IDENTITY_PRIVATE_KEY }}
          WRITER_AGENT_API_TOKEN: ${{ secrets.WRITER_AGENT_API_TOKEN }}

      - name: Verify apex redirect and canonical website
        run: node scripts/verify-web-production.mjs
        working-directory: apps/web
