openapi: 3.1.0
info:
  title: Writer Agent API (proposed contract)
  version: 0.4.0-proposed
  summary: Suggested API contract derived from the Writer Agent V0.3 Figma Make prototype.
  description: >
    THIS IS A PROPOSED CONTRACT. No backend implements it yet.

    Derived from UI behaviour in `src/` and the specs in `docs/features/*.md`.

    Operations marked `x-design-status: proposed` contain unresolved product ambiguity

    and must be confirmed during development (see docs/implementation/HANDOFF.md#open-questions).

    Operations marked `x-design-status: derived-from-ui` map directly to an implemented prototype interaction.


    Conventions

    - Business IDs (WORLD-002, U-001, P-003, R-001) are stable and server-assigned.

    - Mutable resources expose `version` and an `ETag`; writes require `If-Match` (optimistic locking).
      A mismatch returns 409 `VERSION_CONFLICT` or 412; the server never silently overwrites.
    - All POST operations that create or mutate accept `Idempotency-Key`.

    - Errors use RFC 9457 Problem Details (`application/problem+json`).

    - `x-required-role` lists the actor roles allowed (author | agent | system). See
    docs/contracts/permissions.md.

    - Long-running work returns 202 + AgentTask.
servers:
  - url: https://api.example.invalid/v1
    description: Placeholder; deployment undecided (OQ-026)
security:
  - bearerAuth: []
tags:
  - name: Workspace
  - name: Chapters
  - name: Knowledge
  - name: Relations
  - name: Sources
  - name: Issues
  - name: Reasoning
  - name: AgentTasks
  - name: Proposals
  - name: Audit
  - name: Author Notes
    description: Informal author application state, isolated from Harness facts.
  - name: Evidence Review
    description: Author-triggered, fixed-revision continuity review. Verified quotes are evidence, not verified AI
      judgments.
  - name: Agent Runtime
    description: Secret-free local worker status for the authenticated author.
paths:
  /projects/{projectId}/workspace:
    get:
      tags:
        - Workspace
      operationId: getWorkspace
      summary: Read project workspace and restore user state (Journey E)
      x-feature-ids:
        - WS-001
        - WS-010
        - KB-001
      x-design-status: derived-from-ui
      x-required-role:
        - author
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Workspace snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "404":
          $ref: "#/components/responses/NotFound"
      x-implementation-status: implemented
    patch:
      tags:
        - Workspace
      operationId: updateWorkspaceState
      summary: Persist user UI state (layout, theme, last view/chapter, recent entries)
      x-feature-ids:
        - WS-004
        - WS-010
        - WS-011
        - KB-010
      x-design-status: derived-from-ui
      x-required-role:
        - author
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserWorkspaceState"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserWorkspaceState"
      x-implementation-status: implemented
  /projects/{projectId}/chapters:
    get:
      tags:
        - Chapters
      operationId: listChapters
      summary: Chapter tree grouped by volume, with pending counts
      x-feature-ids:
        - WS-001
      x-design-status: derived-from-ui
      x-required-role:
        - author
        - agent
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Chapters
          content:
            application/json:
              schema:
                type: object
                required:
                  - volumes
                properties:
                  volumes:
                    type: array
                    items:
                      $ref: "#/components/schemas/VolumeWithChapters"
      x-implementation-status: implemented
  /projects/{projectId}/chapters/{chapterId}:
    get:
      tags:
        - Chapters
      operationId: getChapter
      summary: Chapter with head revision content
      x-feature-ids:
        - WS-001
        - WS-002
      x-design-status: derived-from-ui
      x-required-role:
        - author
        - agent
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/ChapterId"
      responses:
        "200":
          description: Chapter
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChapterDetail"
        "404":
          $ref: "#/components/responses/NotFound"
      x-implementation-status: implemented
  /projects/{projectId}/chapters/{chapterId}/revisions:
    get:
      tags:
        - Chapters
      operationId: listChapterRevisions
      summary: Revision history of a chapter
      x-feature-ids:
        - WS-003
      x-design-status: proposed
      x-required-role:
        - author
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/ChapterId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Revisions (newest first, without paragraphs)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/ChapterRevisionSummary"
      x-implementation-status: implemented
    post:
      tags:
        - Chapters
      operationId: saveChapterRevision
      summary: Save manuscript (autosave / Cmd+S). AUTHOR ONLY.
      description: >
        Creates an immutable revision based on `baseRevisionId`.

        If the head has moved, returns 409 REVISION_CONFLICT with the head revision; the server never
        overwrites.

        Identical content (same hash as head) returns 200 with the existing revision (idempotent no-op).

        Agent credentials always receive 403 AGENT_WRITE_FORBIDDEN (INV-01).

        Whether each save produces a Git commit is OQ-015.
      x-feature-ids:
        - WS-003
        - REVIEW-006
      x-design-status: proposed
      x-required-role:
        - author
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/ChapterId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChapterRevisionCreate"
      responses:
        "200":
          description: No-op, content identical to head
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChapterRevisionSummary"
        "201":
          description: Revision created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChapterRevisionSummary"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
      x-implementation-status: implemented
  /projects/{projectId}/knowledge/overview:
    get:
      tags:
        - Knowledge
      operationId: getKnowledgeOverview
      summary: Knowledge home cards (recent viewed, recent changes, open issues, pending proposals)
      x-feature-ids:
        - KB-001
        - KB-010
      x-design-status: derived-from-ui
      x-required-role:
        - author
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeOverview"
      x-implementation-status: proposed
  /projects/{projectId}/knowledge/entries:
    get:
      tags:
        - Knowledge
      operationId: searchKnowledgeEntries
      summary: List / search knowledge entries
      description: Search never creates entries (BR-KB-1). Matches id, title, summary and clause text.
      x-feature-ids:
        - KB-002
        - KB-003
        - KB-011
      x-design-status: derived-from-ui
      x-required-role:
        - author
        - agent
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: q
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            $ref: "#/components/schemas/KnowledgeCategory"
        - name: displayStatus
          in: query
          schema:
            $ref: "#/components/schemas/DisplayStatus"
        - name: includeDeprecated
          in: query
          schema:
            type: boolean
            default: false
        - name: include
          in: query
          description: Set to `relations` for the relation-card view (KB-011)
          schema:
            type: string
            enum:
              - relations
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of entries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/KnowledgeEntrySummary"
      x-implementation-status: proposed
  /projects/{projectId}/knowledge/entries/{entryId}:
    get:
      tags:
        - Knowledge
      operationId: getKnowledgeEntry
      summary: Entry detail with clauses, sources, versions, decisions, impacts, issues
      x-feature-ids:
        - KB-004
        - KB-005
        - KB-006
      x-design-status: derived-from-ui
      x-required-role:
        - author
        - agent
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/EntryId"
      responses:
        "200":
          description: Entry
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeEntryDetail"
        "404":
          $ref: "#/components/responses/NotFound"
      x-implementation-status: proposed
  /projects/{projectId}/knowledge/entries/{entryId}/versions:
    get:
      tags:
        - Knowledge
      operationId: listKnowledgeVersions
      summary: Immutable version history of an entry
      x-feature-ids:
        - KB-006
      x-design-status: derived-from-ui
      x-required-role:
        - author
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/EntryId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Versions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/KnowledgeVersion"
      x-implementation-status: proposed
  /projects/{projectId}/knowledge/graph:
    get:
      tags:
        - Relations
      operationId: getRelationGraph
      summary: One-level relation graph around a center object
      x-feature-ids:
        - REL-001
        - REL-002
        - REL-003
        - REL-004
      x-design-status: derived-from-ui
      x-required-role:
        - author
        - agent
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: center
          in: query
          required: true
          schema:
            type: string
          example: WORLD-003
        - name: depth
          in: query
          description: Only 1 is supported in P0/P1 (OQ-039)
          schema:
            type: integer
            enum:
              - 1
            default: 1
        - name: kinds
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/NodeKind"
        - name: includeProposed
          in: query
          description: Include AI-inferred (status=proposed) relations, flagged as such
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: Graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelationGraph"
        "404":
          $ref: "#/components/responses/NotFound"
      x-implementation-status: proposed
  /projects/{projectId}/sources/{sourceId}:
    get:
      tags:
        - Sources
      operationId: resolveSource
      summary: Resolve a source / evidence locator to original material
      description: |
        Returns the excerpt in context (note paragraphs or chapter paragraphs), availability,
        and whether the stored sourceHash still matches (stale detection, BR-KB-7).
      x-feature-ids:
        - KB-005
        - WS-005
        - REVIEW-005
      x-design-status: derived-from-ui
      x-required-role:
        - author
        - agent
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: sourceId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Resolved source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolvedSource"
        "404":
          $ref: "#/components/responses/NotFound"
      x-implementation-status: proposed
  /projects/{projectId}/issues:
    get:
      tags:
        - Issues
      operationId: listIssues
      summary: Unknowns, conflicts and AI candidates
      x-feature-ids:
        - ISSUE-001
        - ISSUE-002
        - KB-001
      x-design-status: derived-from-ui
      x-required-role:
        - author
        - agent
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: kind
          in: query
          schema:
            $ref: "#/components/schemas/IssueKind"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/IssueStatus"
        - name: scope
          in: query
          schema:
            type: string
            enum:
              - book
              - volume
              - chapter
        - name: urgency
          in: query
          schema:
            type: string
            enum:
              - high
              - medium
              - low
        - name: related
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Issues and counts per kind (non-resolved)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/KnowledgeIssue"
                      countsByKind:
                        type: object
                        additionalProperties:
                          type: integer
      x-implementation-status: proposed
    post:
      tags:
        - Issues
      operationId: createIssue
      summary: Create an issue (agent may create conflict / candidate only)
      x-feature-ids:
        - ISSUE-001
      x-design-status: proposed
      x-required-role:
        - author
        - agent
        - system
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeIssue"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"
      x-implementation-status: proposed
  /projects/{projectId}/issues/{issueId}/transitions:
    post:
      tags:
        - Issues
      operationId: transitionIssue
      summary: Author changes issue status (intentional, defer, reopen, not-a-conflict, convert, dismiss)
      x-feature-ids:
        - ISSUE-003
        - ISSUE-004
        - ISSUE-005
        - ISSUE-006
      x-design-status: derived-from-ui
      x-required-role:
        - author
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: issueId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
              properties:
                action:
                  type: string
                  enum:
                    - mark_intentional
                    - unmark_intentional
                    - defer
                    - reopen
                    - judge_not_conflict
                    - convert_to_proposal
                    - dismiss
                    - start_discussion
                note:
                  type: string
                reasoningSessionId:
                  type: string
      responses:
        "200":
          description: Updated issue (+ created proposal when converting)
          content:
            application/json:
              schema:
                type: object
                properties:
                  issue:
                    $ref: "#/components/schemas/KnowledgeIssue"
                  decision:
                    $ref: "#/components/schemas/Decision"
                  proposal:
                    $ref: "#/components/schemas/Proposal"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
      x-implementation-status: proposed
  /projects/{projectId}/reasoning/sessions:
    get:
      tags:
        - Reasoning
      operationId: listReasoningSessions
      x-feature-ids:
        - CR-001
      x-design-status: derived-from-ui
      x-required-role:
        - author
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/SessionStatus"
        - name: related
          in: query
          description: Find sessions related to an entry / issue (KB-009, OQ-037)
          schema:
            type: string
        - name: includeArchived
          in: query
          schema:
            type: boolean
            default: false
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/ReasoningSessionSummary"
      x-implementation-status: proposed
      summary: List reasoning sessions
    post:
      tags:
        - Reasoning
      operationId: createReasoningSession
      x-feature-ids:
        - CR-001
        - KB-009
        - ISSUE-007
      x-design-status: derived-from-ui
      x-required-role:
        - author
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                relatedRefs:
                  type: array
                  items:
                    $ref: "#/components/schemas/ObjectRef"
                sourceIssueId:
                  type: string
      responses:
        "201":
          description: Created (status=empty, main branch)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReasoningSession"
      x-implementation-status: proposed
      summary: Create a reasoning session
  /projects/{projectId}/reasoning/sessions/{sessionId}:
    get:
      tags:
        - Reasoning
      operationId: getReasoningSession
      summary: Session with branches, nodes, hypotheses
      x-feature-ids:
        - CR-001
        - CR-006
        - CR-013
      x-design-status: derived-from-ui
      x-required-role:
        - author
        - agent
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Session
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReasoningSession"
        "404":
          $ref: "#/components/responses/NotFound"
      x-implementation-status: proposed
    patch:
      tags:
        - Reasoning
      operationId: updateReasoningSession
      summary: Rename, pause, resume, archive, restore, set hypothesis status
      x-feature-ids:
        - CR-008
        - CR-012
        - CR-015
      x-design-status: proposed
      x-required-role:
        - author
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                action:
                  type: string
                  enum:
                    - pause
                    - resume
                    - archive
                    - restore
                hypotheses:
                  type: object
                  additionalProperties:
                    type: string
                    enum:
                      - pending_verification
                      - author_leaning
                      - shelved
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReasoningSession"
        "409":
          $ref: "#/components/responses/Conflict"
      x-implementation-status: proposed
  /projects/{projectId}/reasoning/sessions/{sessionId}/branches:
    post:
      tags:
        - Reasoning
      operationId: createReasoningBranch
      summary: Fork a new branch from any existing node (never rewrites history)
      x-feature-ids:
        - CR-006
        - CR-005
      x-design-status: derived-from-ui
      x-required-role:
        - author
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - forkNodeId
              properties:
                forkNodeId:
                  type: string
                name:
                  type: string
                fromInterpretationOptionId:
                  type: string
                  description: When choosing an interpretation; server returns the existing branch if one already forks from
                    this node for this option (CR-005)
      responses:
        "200":
          description: Existing branch for this interpretation returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReasoningBranch"
        "201":
          description: Branch created (headNodeId = forkNodeId)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReasoningBranch"
        "404":
          $ref: "#/components/responses/NotFound"
      x-implementation-status: proposed
  /projects/{projectId}/reasoning/sessions/{sessionId}/current-branch:
    put:
      tags:
        - Reasoning
      operationId: switchReasoningBranch
      summary: Switch current branch (user state only; nodes unchanged)
      x-feature-ids:
        - CR-006
      x-design-status: derived-from-ui
      x-required-role:
        - author
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - branchId
              properties:
                branchId:
                  type: string
      responses:
        "204":
          description: Switched
      x-implementation-status: proposed
  /projects/{projectId}/reasoning/sessions/{sessionId}/branches/{branchId}/nodes:
    post:
      tags:
        - Reasoning
      operationId: appendAuthorNode
      summary: Append an AUTHOR node (claim, response, choice, conclusion) to a branch head
      description: >
        Server sets `author` from credentials. Agent credentials get 403 ROLE_NODE_FORBIDDEN (INV-03).

        `expectedHeadNodeId` must equal current head, otherwise 409 VERSION_CONFLICT (no silent append to a
        moved head).

        Optionally request an agent turn in the same call (`requestAgentTurn`), returning the AgentTask.
      x-feature-ids:
        - CR-002
        - CR-004
        - CR-005
        - CR-009
      x-design-status: derived-from-ui
      x-required-role:
        - author
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/SessionId"
        - name: branchId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorNodeCreate"
      responses:
        "201":
          description: Node appended (and optional agent task queued)
          content:
            application/json:
              schema:
                type: object
                required:
                  - node
                properties:
                  node:
                    $ref: "#/components/schemas/ReasoningNode"
                  agentTask:
                    $ref: "#/components/schemas/AgentTask"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
      x-implementation-status: proposed
  /projects/{projectId}/reasoning/sessions/{sessionId}/agent-turns:
    post:
      tags:
        - Reasoning
      operationId: requestAgentTurn
      summary: Ask the agent to respond on a branch (understanding, challenges, focus, interpretations, links, reply)
      x-feature-ids:
        - CR-002
        - CR-003
        - CR-004
        - CR-005
        - CR-007
