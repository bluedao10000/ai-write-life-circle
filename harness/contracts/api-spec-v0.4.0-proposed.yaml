components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "Production: one configured author authenticated by a 256-bit opaque Bearer token over HTTPS;
        token never comes from query strings or actor headers. Local development identity is development/test
        only."
  headers:
    ETag:
      description: Current resource version (optimistic locking)
      schema:
        type: string
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
    ChapterId:
      name: chapterId
      in: path
      required: true
      schema:
        type: string
    EntryId:
      name: entryId
      in: path
      required: true
      schema:
        type: string
      example: WORLD-002
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
      example: R-001
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
    ProposalId:
      name: proposalId
      in: path
      required: true
      schema:
        type: string
      example: P-001
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag / version the client based its change on
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Repeat requests with the same key return the first result
      schema:
        type: string
        maxLength: 128
  responses:
    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Role not allowed (e.g. AGENT_WRITE_FORBIDDEN, ROLE_NODE_FORBIDDEN, AUTHOR_DECISION_REQUIRED)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: VERSION_CONFLICT, REVISION_CONFLICT, INVALID_TRANSITION, TASK_ALREADY_RUNNING
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PreconditionFailed:
      description: If-Match missing or stale
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unprocessable:
      description: Validation failed (e.g. UNRESOLVABLE_EVIDENCE, MISSING_CERTAINTY, UNKNOWN_TARGET)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Problem:
      type: object
      required:
        - type
        - title
        - status
        - code
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          enum:
            - NOT_FOUND
            - VERSION_CONFLICT
            - REVISION_CONFLICT
            - INVALID_TRANSITION
            - TASK_ALREADY_RUNNING
            - AGENT_WRITE_FORBIDDEN
            - ROLE_NODE_FORBIDDEN
            - AUTHOR_DECISION_REQUIRED
            - UNRESOLVABLE_EVIDENCE
            - MISSING_CERTAINTY
            - UNKNOWN_TARGET
            - PRECONDITION_REQUIRED
            - HARNESS_WRITE_FAILED
            - VALIDATION_FAILED
            - AUDIT_WRITE_FAILED
            - REVIEW_CONTEXT_TOO_LARGE
            - REVIEW_EMPTY_CHAPTER
            - REVIEW_REVISION_CHANGED
            - REVIEW_SOURCE_UNAVAILABLE
            - REVIEW_UNAVAILABLE
            - REVIEW_BUSY
            - REVIEW_CONSENT_REQUIRED
            - REVIEW_CONTEXT_CHANGED
            - REVIEW_HISTORY_FULL
            - REVIEW_NOT_COMPLETED
            - REVIEW_NOT_RUNNING
            - REVIEW_VERSION_CONFLICT
            - REVIEW_STORAGE_FAILED
            - NOTE_VERSION_CONFLICT
            - NEXT_WRITING_EXISTS
            - METHOD_NOT_ALLOWED
        detail:
          type: string
        current:
          description: Current server-side representation or version, for conflict resolution
        requestId:
          type: string
    Page:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items: {}
        nextCursor:
          type:
            - string
            - "null"
        total:
          type: integer
    Actor:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - author
            - agent
            - system
        id:
          type: string
        label:
          type: string
          description: "UI label: 作者 / Agent 整理 / 系统复审"
    ObjectRef:
      type: object
      required:
        - type
        - id
      properties:
        type:
          type: string
          enum:
            - entry
            - clause
            - relation
            - issue
            - proposal
            - session
            - node
            - chapter
            - note
            - source
        id:
          type: string
    Workspace:
      type: object
      required:
        - project
        - userState
        - counts
      properties:
        project:
          type: object
          properties:
            projectId:
              type: string
            title:
              type: string
            harnessHeadCommit:
              type: string
            projectedFromCommit:
              type: string
            demo:
              type: boolean
              description: True only for demo seeds; UI shows DemoFlag
        userState:
          $ref: "#/components/schemas/UserWorkspaceState"
        counts:
          type: object
          properties:
            pendingProposals:
              type: integer
            openIssues:
              type: integer
            runningTasks:
              type: integer
            pausedSessions:
              type: integer
        runningTasks:
          type: array
          items:
            $ref: "#/components/schemas/AgentTask"
        capabilities:
          $ref: "#/components/schemas/WorkspaceCapabilities"
    UserWorkspaceState:
      type: object
      properties:
        lastView:
          type: string
          enum:
            - write
            - kb
            - reasoning
        lastChapterId:
          type: string
        layout:
          type: object
          properties:
            leftOpen:
              type: boolean
            rightOpen:
              type: boolean
            leftW:
              type: integer
              minimum: 200
              maximum: 360
            rightW:
              type: integer
              minimum: 320
              maximum: 560
            focus:
              type: boolean
        theme:
          type: string
          enum:
            - light
            - dark
        kbRecent:
          type: array
          maxItems: 6
          items:
            type: string
        activeSessionId:
          type: string
        currentBranchBySession:
          type: object
          additionalProperties:
            type: string
    VolumeWithChapters:
      type: object
      properties:
        volumeId:
          type: string
        title:
          type: string
        chapters:
          type: array
          items:
            type: object
            properties:
              chapterId:
                type: string
              title:
                type: string
              meta:
                type: string
              order:
                type: integer
              wordCount:
                type: integer
              pendingProposalCount:
                type: integer
              needsReview:
                type: boolean
    ChapterDetail:
      type: object
      required:
        - chapterId
        - title
        - headRevision
      properties:
        chapterId:
          type: string
        volumeId:
          type: string
        title:
          type: string
        meta:
          type: string
        headRevision:
          allOf:
            - $ref: "#/components/schemas/ChapterRevisionSummary"
            - type: object
              properties:
                markdown:
                  type: string
                  description: Exact Markdown content; keeps formatting and block structure intact.
    ChapterRevisionCreate:
      type: object
      required:
        - baseRevisionId
        - markdown
      properties:
        baseRevisionId:
          type:
            - string
            - "null"
        clientSavedAt:
          type: string
          format: date-time
        trigger:
          type: string
          enum:
            - autosave
            - manual
            - chapter_switch
            - pre_review
        markdown:
          type: string
          maxLength: 2097152
          description: TipTap Markdown serialization; preserves paragraph, quote, list, hard-break and inline formatting
            structure.
    ChapterRevisionSummary:
      type: object
      properties:
        revisionId:
          type: string
        parentRevisionId:
          type:
            - string
            - "null"
        contentHash:
          type: string
        wordCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        createdBy:
          $ref: "#/components/schemas/Actor"
        commitRef:
          type:
            - string
            - "null"
    KnowledgeCategory:
      type: string
      enum:
        - intent
        - world
        - character
        - plot
        - timeline
        - foreshadow
        - style
        - research
    DisplayStatus:
      type: string
      description: Derived UI status (StatusPill). See domain-model.md#knowledge-status-model
      enum:
        - confirmed
        - pending
        - undetermined
        - conflict
        - deprecated
    Lifecycle:
      type: string
      enum:
        - proposed
        - confirmed
        - deprecated
    NodeKind:
      type: string
      enum:
        - intent
        - world
        - character
        - plot
        - timeline
        - foreshadow
        - style
        - research
        - proposal
        - issue
        - reasoning
        - chapter
    KnowledgeEntrySummary:
      type: object
      required:
        - entryId
        - title
        - category
        - displayStatus
      properties:
        entryId:
          type: string
        title:
          type: string
        category:
          $ref: "#/components/schemas/KnowledgeCategory"
        summary:
          type: string
        lifecycle:
          $ref: "#/components/schemas/Lifecycle"
        displayStatus:
          $ref: "#/components/schemas/DisplayStatus"
        unresolvedClauseCount:
          type: integer
          description: "UI: 含 N 项未定"
        updatedAt:
          type: string
          format: date-time
        relations:
          type: array
          items:
            $ref: "#/components/schemas/RelationView"
    KnowledgeClause:
      type: object
      required:
        - clauseId
        - section
        - text
        - lifecycle
        - determination
      properties:
        clauseId:
          type: string
        section:
          type: string
          enum:
            - rule
            - scope
            - exception
            - question
            - cost
        order:
          type: integer
        text:
          type: string
        lifecycle:
          $ref: "#/components/schemas/Lifecycle"
        determination:
          type: string
          enum:
            - determined
            - undetermined
        intentionalUnknown:
          type: boolean
        displayStatus:
          $ref: "#/components/schemas/DisplayStatus"
        sourceIds:
          type: array
          items:
            type: string
    SourceType:
      type: string
      enum:
        - author_statement
        - manuscript
        - confirmed_knowledge
        - ai_inference
        - external_research
    Locator:
      oneOf:
        - type: object
          required:
            - kind
            - noteId
            - paragraph
          properties:
            kind:
              const: note_paragraph
            noteId:
              type: string
            paragraph:
              type: integer
        - type: object
          required:
            - kind
            - chapterId
            - paragraph
            - quote
          properties:
            kind:
              const: chapter_text
            chapterId:
              type: string
            revisionId:
              type: string
            paragraph:
              type: integer
            quote:
              type: string
            charStart:
              type: integer
            charEnd:
              type: integer
        - type: object
          required:
            - kind
            - entryId
          properties:
            kind:
              const: entry
            entryId:
              type: string
            clauseId:
              type: string
        - type: object
          required:
            - kind
            - citation
          properties:
            kind:
              const: external
            citation:
              type: string
            url:
              type: string
        - type: object
          required:
            - kind
          properties:
            kind:
              const: none
      discriminator:
        propertyName: kind
    EvidenceReference:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        sourceId:
          type: string
        quote:
          type: string
        verified:
          type: boolean
          const: true
        contentHash:
          type: string
          pattern: ^sha256:[a-f0-9]{64}$
        sourceHash:
          type: string
          pattern: ^sha256:[a-f0-9]{64}$
        startUTF16:
          anyOf:
            - type: integer
              minimum: 0
              maximum: 9007199254740991
            - type: "null"
        endUTF16:
          anyOf:
            - type: integer
              minimum: 0
              maximum: 9007199254740991
            - type: "null"
        ambiguity:
          type: string
          enum:
            - unique
            - ambiguous
      required:
        - sourceId
        - quote
        - verified
        - contentHash
        - sourceHash
        - startUTF16
        - endUTF16
        - ambiguity
      additionalProperties: false
    KnowledgeSource:
      allOf:
        - $ref: "#/components/schemas/EvidenceReference"
        - type: object
          required:
            - sourceId
          properties:
            recordedAt:
              type: string
              format: date-time
    KnowledgeVersion:
      type: object
      properties:
        versionId:
          type: string
        entryId:
          type: string
        label:
          type: string
          example: v2
        changeSummary:
          type: string
        createdBy:
          $ref: "#/components/schemas/Actor"
        proposalId:
          type:
            - string
            - "null"
        decisionIds:
          type: array
          items:
            type: string
        commitRef:
          type: string
        createdAt:
          type: string
          format: date-time
    ImpactAssessment:
      type: object
      properties:
        target:
          $ref: "#/components/schemas/ObjectRef"
        level:
          type: string
          enum:
            - high
            - medium
            - low
        note:
          type: string
        speculative:
          type: boolean
    KnowledgeEntryDetail:
      allOf:
        - $ref: "#/components/schemas/KnowledgeEntrySummary"
        - type: object
          properties:
            version:
              type: integer
            fields:
              type: array
              items:
                type: object
                properties:
                  key:
                    type: string
                  value:
                    type: string
            clauses:
              type: array
              items:
                $ref: "#/components/schemas/KnowledgeClause"
            sources:
              type: array
              items:
                $ref: "#/components/schemas/KnowledgeSource"
            versions:
              type: array
              items:
                $ref: "#/components/schemas/KnowledgeVersion"
            decisions:
              type: array
              items:
                $ref: "#/components/schemas/Decision"
            impacts:
              type: array
              items:
                $ref: "#/components/schemas/ImpactAssessment"
            issues:
              type: array
              items:
                $ref: "#/components/schemas/KnowledgeIssue"
            pendingProposalIds:
              type: array
              items:
                type: string
            sourcePath:
              type: string
            sourceHash:
              type: string
    KnowledgeOverview:
      type: object
