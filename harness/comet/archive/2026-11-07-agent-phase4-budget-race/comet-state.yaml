acceptance:
  - id: A1
    source: brief.md
    text: "A1: With the shared daily token limit set to one token less than two
      valid reservations, race one normal Creative job claim against one
      `memory.consolidate` reservation using independent Service instances over
      the same state directory. Exactly one is admitted; persisted token and
      attempt counters reflect that admission and never exceed their configured
      limits."
    result: passed
    reason:
      text: 测试将每日 token 上限设为两份预留减一；Creative claim 在持有共享状态锁期间完成唯一预算预留，另一个 Service 的
        memory reservation 等锁释放后因预算耗尽被拒绝。新 Service 读取到一份 token 预留和一次
        attempt，均未超限。证据：apps/api-go/internal/creative/memory_budget_test.go:136-218；两条事务共用
        apps/api-go/internal/creative/store.go:131-146。
      truncated: false
  - id: A2
    source: brief.md
    text: "A2: Reopen the shared state through a fresh Service and verify that the
      committed daily counters match the winning admission. Existing memory
      reservation idempotency and settlement tests continue to prove a replay
      does not double-reserve and unknown usage does not release tokens."
    result: passed
    reason:
      text: 并发用例通过新建 Service 校验提交计数；现有测试覆盖重复预留不重复计数、未知 usage
        保留完整预留及终态结算重放。证据：apps/api-go/internal/creative/memory_budget_test.go:36-107,210-218。
      truncated: false
  - id: A3
    source: brief.md
    text: "A3: Run the Creative and memory task race suites with Go's race detector;
      no model provider is contacted and no change is made to the stored state
      schema or Go business-points authority."
    result: passed
    reason:
      text: Runtime 在冻结候选上运行 go test -race ./internal/creative ./internal/memorytasks
        并通过。候选差异只有测试文件；新用例使用假 Meter，不联系模型 Provider，也不修改生产代码、持久化 schema 或 Go
        点数权威。
      truncated: false
