acceptance:
  - id: A1
    source: brief.md
    text: "**A1 — Equal budget:** Given single-role and five-role plan checks for
      the same policy, Go reserves the existing single-role parent amount for
      either run; the five child limits sum exactly to it, and the five-role
      path does not increase the daily reservation. Unknown usage retains the
      full parent exposure."
    result: passed
    reason:
      text: Go now reserves the existing single-role parent amount for both
        strategies. The five-role orchestrator assigns five child caps whose sum
        is exactly the parent cap, using the coordinator remainder for
        indivisible budgets, and Go independently enforces each admitted child
        cap. Runtime tests cover equal token and point reservations, odd
        remainders, daily admission, and full reservation retention for unknown
        usage. Generated pairs reserve 22,240 tokens for both modes and all five
        child caps sum to 22,240.
      truncated: false
  - id: A2
    source: brief.md
    text: "**A2 — Valid paired comparison:** Given development or held-out data, the
      runner accepts a pair only when both runs use the same case and saved
      revision, provider/model, deadline, and parent cap. It rejects mismatched
      or duplicate pairs and refuses development/held-out overlap."
    result: passed
    reason:
      text: Pair validation rejects changed saved revisions/content and input hashes,
        provider/model or deadline differences, parent-cap mismatches, and
        duplicate task/job identities. Dataset loading rejects duplicate case
        IDs, repeated versions, and cross-split case or request overlap. All
        three dev and all three held-out reports are eligible; inside every pair
        the two modes have the same revision, content hash, input hash,
        provider/model, 17,000 ms deadline policy, and 22,240-token parent cap.
      truncated: false
  - id: A3
    source: brief.md
    text: "**A3 — Evidence-based quality report:** The report derives deterministic
      results and execution metrics from Go task receipts and persisted role
      results. It reports pairwise Judge and human agreement only for eligible
      labeled pairs, randomizes candidate order, records rubric/dataset/runtime
      versions, and leaves quality fields `null` when evidence is absent. A
      deterministic failure cannot be rescued by a Judge score."
    result: passed
    reason:
      text: Reports derive outcomes, reservations, token metrics, call counts, task
        and role latency samples, and persisted five-role completion records
        from Go task receipts. All six multi-role runs contain calls 1 through 5
        in canonical role order with completed status, numeric durations, and
        known input/output usage that sums to parent usage. Pairwise Judge
        eligibility excludes deterministic failures, candidate order is
        randomized and recorded, and dataset, runtime, rubric, and
        prompting/schema versions are present. Human and Judge agreement are
        calculated only for eligible double-labeled cases; without such labels,
        quality and agreement fields are null. Tests confirm an ineligible
        deterministic result cannot be submitted to the Judge.
      truncated: false
  - id: A4
    source: brief.md
    text: "**A4 — Read-only authority and failure behavior:** Single- and multi-role
      runs keep the existing task authority, zero tool/write permissions,
      cancellation and no-retry policy, and no business or manuscript changes.
      Tests exercise provider failure and unknown usage using local synthetic
      providers."
    result: passed
    reason:
      text: The existing Go task authority remains in place; both modes use zero tools
        and zero write permissions, fixed read-only role prompts, no business or
        manuscript changes, and no automatic retry. Local synthetic-provider
        tests exercise provider failure, cancellation, missing usage, and
        partial child usage; provider failure remains incomplete and no retry is
        attempted.
      truncated: false
  - id: A5
    source: brief.md
    text: "**A5 — No fabricated live evidence:** Automated development checks use
      localhost synthetic providers only. A remote Judge/evaluation path
      requires explicit synthetic-fixture and token-budget confirmation; this
      change does not execute it. Synthetic results are labeled as engineering
      evidence, and the five-role setting remains opt-in."
    result: passed
    reason:
      text: The benchmark uses loopback synthetic HTTP providers and reports
        realLLMCalled=false, qualityValidated=false, and synthetic engineering
        mode on both splits. No remote or paid model path was executed. Reports
        identify the evidence as synthetic, and five-role execution remains
        default-off and opt-in; no benchmark result changes the author's
        setting.
      truncated: false
