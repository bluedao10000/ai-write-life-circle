acceptance:
  - id: A1
    source: brief.md
    text: "A1: A metrics response always contains `24h` and `7d` windows. For every
      registered Worker task kind, it reports claimed, started, completed,
      failed, interrupted, and unknown event counts from persisted audit
      records, along with claim-to-started and started-to-terminal sample counts
      and P50/P95 values. Empty percentile samples are omitted."
    result: passed
    reason:
      text: Both fixed windows are built for all five registered task kinds. Counts
        and transition samples use the specified audit timestamps; nearest-rank
        P50/P95 values are omitted when empty. Runtime’s Go race check passed.
      truncated: false
  - id: A2
    source: brief.md
    text: "A2: Each window reports the five registered read-only Creative roles.
      Admissions use each persisted model-step admission time. Results, status,
      usage, and duration use the parent task's terminal event time. The
      projection distinguishes known usage from missing usage, sums known tokens
      and admitted token limits separately, and never treats unknown usage as
      zero consumption."
    result: passed
    reason:
      text: The five registered Creative roles use admission timestamps for admissions
        and the parent terminal timestamp for results, status, usage, and
        duration. Missing usage increments unknown usage and its reserved-token
        bound; known usage and reservations are reported separately.
      truncated: false
  - id: A3
    source: brief.md
    text: "A3: Windows use the interval `[sampledAt - duration, sampledAt]` from one
      `sampledAt` captured per projection. Missing, malformed, or future event
      timestamps do not enter a window. Existing lifetime metrics retain their
      current values. Reopening the same task registry and projecting at the
      same `sampledAt` returns the same windows; no task IDs, book IDs, session
      IDs, or source text appear."
    result: passed
    reason:
      text: The projection captures one sampledAt, uses inclusive fixed-window bounds,
        and excludes missing, malformed, and future timestamps. Tests cover
        boundaries and stable results after reopening the registry. Lifetime
        aggregation behavior is preserved, and the projection/export uses no
        task identifiers or source text.
      truncated: false
  - id: A4
    source: brief.md
    text: "A4: Go race tests for `agenttasks` and `agentruntime`, plus `pnpm
      test:runtime`, pass. Runtime tests use local synthetic services and make
      no external model request. No persisted state schema or Go business-points
      authority changes."
    result: passed
    reason:
      text: "Runtime recorded both required checks as passed: the Go race tests and
        pnpm test:runtime. The integration script verifies zero model calls
        using its local synthetic setup. The candidate diff adds no persisted
        state fields or business-points changes."
      truncated: false
