        - apps/api-go/internal/thinking/http.go validates autonomy before
          reservation/model delivery and permits autonomy only on original
          message acceptance.
        - apps/api-go/internal/thinking/autonomy_test.go covers admission
          limits, public projection compatibility, Creative intake exclusion,
          and same-key resume replay.
        - "Observed: ordinary-message and default-off compatibility tests pass
          in the full Agent suite and Go thinking race suite."
      note: Autonomy remains per-message opt-in. Go checks completion criteria,
        explicit read-only approval, scopes, model tool support, step count,
        deadline, and forbidden combinations before the paid path; old clients
        still receive the prior public projection.
    - id: A2
      status: implemented-with-evidence
      evidence:
        - apps/agent/src/runtime/governance/task-coordinator.ts enforces exact
          goal/criteria, unique step IDs, admitted step ceiling, read-only tool
          allowlist, and terminal-state sealing.
        - apps/agent/src/tools/registry.ts requires a matching pending stepId
          before an evidence request and removes all write, organizing, task,
          Canon, and external-effect tools.
        - apps/agent/test/autonomy.test.ts covers duplicate plan adoption,
          unknown and mismatched step IDs, expanded plans, write-tool requests,
          and the exact one-tool/four-turn floor.
        - "Observed: the focused autonomy test file passes 11/11."
      note: The first model turn must persist a plan through the governed tool
        gateway. No evidence HTTP request occurs for an absent, duplicate,
        expanded, mismatched, or out-of-scope step.
    - id: A3
      status: implemented-with-evidence
      evidence:
        - apps/agent/src/tools/registry.ts routes each evidence call through the
          existing Tool Gateway and Go tool RPC under the current authorization.
        - apps/api-go/internal/thinking/http.go now creates Creative intake only
          for original messages; every resume and same-key replay is excluded.
        - scripts/test-thinking-agent.mjs verifies zero write/organize tool
          payloads, current-authorization execution, and unchanged business
          version in a real Go/Pi process.
        - "Observed: pnpm test:thinking and the Go thinking race suite pass with
          localhost synthetic providers."
      note: The mode can only execute planned read-only evidence and cannot create a
        task or child Agent, including after explicit resume. A resumed autonomy
        turn reuses the persisted plan and cannot enqueue the normal Creative
        organizer.
    - id: A4
      status: implemented-with-evidence
      evidence:
        - apps/agent/src/sessions/store.ts persists private autonomy evidence in
          the original Durable checkpoint and projects only the public
          plan/completion state.
        - apps/agent/src/runtime/pi-host.ts restores successful evidence on
          resume, forces a tool-free final prose turn after completion, and
          refuses evidence after completion or needs_input.
        - apps/agent/src/runtime/governance/task-coordinator.ts reopens
          unevidenced steps, preserves evidenced steps, and restores a persisted
          completion instead of attempting a second completion tool call.
        - apps/agent/test/autonomy.test.ts covers provider failure before and
          after completion, evidence reuse without a repeated business tool,
          needs_input sealing, cancellation, deadline, authorization revocation,
          and unchanged ordinary execution.
        - apps/api-go/internal/thinking/reliability.go maps autonomy failures to
          the correct public recovery action;
          apps/api-go/internal/thinking/autonomy_test.go covers those mappings
          and resume intake replay.
      note: A restart never automatically replays a paid attempt. Explicit resume uses
        the same plan and limits, retains successful evidence, and can finish
        from a persisted completion or return needs_input. A missing completion
        record fails as AUTONOMY_INCOMPLETE and is never projected as success.
    - id: A5
      status: implemented-with-evidence
      evidence:
        - apps/web/src/features/inspiration/Composer.tsx and
          apps/web/src/features/creative/InspirationWorkspace.tsx expose a
          per-message completion criterion and bounded step control without
          token-budget inputs.
        - apps/web/src/features/inspiration/Messages.tsx renders plan status and
          steps but no tool arguments, payloads, capabilities, or credentials.
        - apps/web/src/features/thinking/errors.ts and
          apps/api-go/internal/thinking/reliability.go expose fixed autonomy
          error and recovery categories.
        - apps/web/src/test/inspiration.test.tsx covers opt-in, no-token-form
          behavior, projected status, and the unchanged ordinary path.
        - harness/architecture/agent-maturity-report.md and related ADRs label
          this as a default-off synthetic-provider engineering pilot and retain
          real-model quality and production-readiness gaps.
      note: The API/UI expose the requested control, completion criteria, status, and
        per-step state with no sensitive payload projection. Product
        documentation now distinguishes local engineering evidence from
        independent acceptance and real-model quality.
