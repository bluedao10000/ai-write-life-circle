acceptance:
  - id: A1
    source: brief.md
    text: "**A1 — Explicit opt-in and compatibility:** A message without `autonomy`
      keeps the existing Thinking protocol, one-message admission, budget,
      tools, and output behavior. A bounded run is accepted only with a nonblank
      goal, completion criteria, `approveReadOnlyTools: true`, at least one
      authorized read-only scope, and a step/deadline limit within the selected
      model/session ceilings; invalid or write-requesting configurations are
      rejected before any model request."
    result: passed
    reason:
      text: Autonomy is per-message opt-in. Go validates the nonblank goal and
        criteria, explicit read-only-tool approval, at least one authorized
        read-only scope, and step/deadline bounds before reservation or Pi
        delivery; ordinary messages retain the existing one-message path.
      truncated: false
  - id: A2
    source: brief.md
    text: "**A2 — Bounded plan:** After the first model admission, the Agent must
      persist `adopt_autonomy_plan` before using evidence tools. The plan echoes
      the author goal and completion criteria, uses at most the admitted step
      count, and can name only currently authorized read-only Story Tools.
      Duplicate plans, unknown tools, scope expansion, write/organize tools, an
      increased deadline/budget, or a plan over the effective limit fail without
      executing the attempted step."
    result: passed
    reason:
      text: adopt_autonomy_plan must be persisted before evidence tools run and is
        bound to the exact author goal and criteria, unique planned IDs, the
        admitted step ceiling, and currently authorized read-only Story Tools.
        Duplicate, expanded, write, organize, unknown-tool, or over-limit plans
        fail before the attempted step executes.
      truncated: false
  - id: A3
    source: brief.md
    text: "**A3 — Governed execution:** Planned tools execute through the existing
      Tool Gateway and Go authorization with the original session, book, author,
      authorization version, scopes, cancellation signal, and model/session
      budget. The mode performs no write, story-recording, organizing, Canon, or
      external business effect, and it cannot create another task or Agent."
    result: passed
    reason:
      text: Planned evidence calls pass through the existing Tool Gateway and Go tool
        authorization using the original session, book, author, authorization
        version, scopes, cancellation/deadline, and model/session budget. The
        autonomy path exposes no write, story-recording, organize, Canon,
        external-effect, child-task, or child-Agent capability; resume does not
        enter Creative intake.
      truncated: false
  - id: A4
    source: brief.md
    text: "**A4 — Explicit completion and failure:** The Agent must call
      `complete_autonomy` with `complete` or `needs_input`. `complete` requires
      every planned step ID; `needs_input` records the remaining step IDs and a
      bounded reason. A run that omits this record, exceeds a limit, stops after
      cancellation, or loses authorization fails or is cancelled without a
      success claim. Existing restart behavior never automatically replays a
      paid execution."
    result: passed
    reason:
      text: complete_autonomy is required for success or needs_input, with all planned
        IDs or the remaining IDs and a bounded reason. Successful evidence is
        checkpointed and reused after explicit recovery without repeating the
        business tool; completed and needs_input states seal further reads;
        post-completion recovery drops tools and may produce final prose without
        another completion call. Limits, cancellation, authorization loss, and
        restart fail safely without a success claim or automatic paid replay.
      truncated: false
  - id: A5
    source: brief.md
    text: "**A5 — Product and evidence:** The API/UI expose the opt-in, completion
      criteria, projected plan, status, and per-step state without exposing
      token forms, credentials, or tool payloads. Tests use localhost synthetic
      providers and cover valid completion, malformed/expanded plans, write-tool
      denial, tool/provider failure, cancellation, deadline, restart/recovery,
      and unchanged ordinary messages. Documentation labels the result
      engineering evidence and keeps bounded autonomy default-off."
    result: passed
    reason:
      text: The API and UI expose opt-in, completion criteria, admitted limits,
        projected plan, status, per-step state, and completion summary without
        token forms, credentials, or tool payloads. Localhost synthetic-provider
        tests cover the required valid and failure paths, and documentation
        labels the result as engineering evidence, keeps bounded autonomy
        default-off, and does not claim real-model or independent validation.
      truncated: false
