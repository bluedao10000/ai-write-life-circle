acceptance:
  - id: A1
    source: brief.md
    text: "**A1 — 相同父预算：** 单角色与五角色计划核对各预留当前单角色单次额度；五个角色的子预算总和恰等于父额度，任何一个子预算都不扩额，未知
      usage 保留整笔预留。"
    result: passed
    reason:
      text: Go reserves the same 22,240-token parent allowance for both modes in each
        evaluated pair. The five persisted role admissions are 4,448 each and
        sum exactly to the parent; Go rejects expanded child admissions. The
        unknown-usage regression retains the full reservation.
      truncated: false
  - id: A2
    source: brief.md
    text: "**A2 — 有效配对：** 开发集与保留集具有独立版本且没有重复 ID 或相同案例内容；每个配对的 Go
      回执证明两种运行使用相同输入、修订、模型、Provider、截止策略和父预算。缺少或不匹配的运行不能进入 Judge 评分。"
    result: passed
    reason:
      text: Dev and held-out use distinct v2 dataset versions and disjoint cases. All
        six pairs are eligible; each Go receipt pair records the same
        revision/content hash, input hash, provider/model, deadline policy, and
        parent reservation. Dataset and pair mismatch regressions reject invalid
        inputs.
      truncated: false
  - id: A3
    source: brief.md
    text: "**A3 — 可追溯报告：** 报告从 Go 任务回执与持久化的 Pi 角色结果生成确定性结论、工具/写入数、模型调用、已知/未知
      token、预留暴露和耗时；金钱成本无权威价格时为 `null`。报告记录数据集、策略、输出合同、Runtime、Judge
      rubric/prompt 版本及 Go/Pi 运行 ID。"
    result: passed
    reason:
      text: Both reports include Go task/job IDs, persisted Pi run and per-role
        results, dataset and runtime versions, strategy/output contract
        versions, Judge rubric/prompt versions, deterministic outcomes, calls,
        token usage/reservations, tool/write counts, and durations. Monetary
        cost is null without authoritative prices.
      truncated: false
  - id: A4
    source: brief.md
    text: "**A4 — Judge 与人工双评：** 专用 pairwise Judge 使用固定 Creative 计划核对
      rubric、无工具治理入口和随机候选顺序；确定性失败不得被 Judge 翻转。人工标注必须绑定数据集版本、案例、两侧 Go Job
      ID、策略与输出合同版本、rubric/prompt
      版本；重复标注者或版本/候选不匹配会被拒绝。只有至少两位不同评审者的有效标签进入双评一致性与偏好统计；缺少有效双评时质量值为 `null`。"
    result: passed
    reason:
      text: The dedicated pairwise Judge uses the fixed rubric through the
        evaluation.judge no-tool governance context, records randomized
        candidate order, and only receives eligible pairs. Annotation validation
        binds both Go jobs and execution versions, rejects repeated reviewers
        and mismatches, and reports null quality without valid double reviews.
      truncated: false
  - id: A5
    source: brief.md
    text: "**A5 — 合成与权限边界：** 验收只访问 localhost 合成 Provider，报告明确 `realLLMCalled=false`
      和 `qualityValidated=false`。多角色保持默认关闭、五个角色无工具且没有业务写入，评测不得自动更改作者设置或执行 Phase
      6。"
    result: passed
    reason:
      text: Runtime receipts and fixture code use only loopback synthetic providers.
        Both reports state realLLMCalled=false and qualityValidated=false;
        multi-role defaults off, all five role definitions have no tools, and
        all six pairs record zero tools and business-content writes. The opt-in
        is applied only to the isolated synthetic evaluation fixture.
      truncated: false
