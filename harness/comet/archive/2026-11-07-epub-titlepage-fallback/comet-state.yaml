acceptance:
  - id: A1
    source: brief.md
    text: 当 NCX/NAV 只指向无可导入正文的封面页，而 spine 后续包含正文时，预览按 spine
      顺序生成正文章节；明确标记或空白封面不生成章节，未标记的标题单独页保留在首个正文片段内，正文完整且不重复，并显示目录不可用提示。
    result: passed
    reason:
      text: Parser filters explicit covers and blank targets, falls back to spine
        order with TOC_UNUSABLE, and preserves an unmarked heading-only title
        with the first prose chapter. Tests and the supplied EPUB parse support
        this behavior; the real file produces 16 chapters with maximum Markdown
        size 182266 bytes.
      truncated: false
  - id: A2
    source: brief.md
    text: 当上述回退样本含两个各自转换后小于 2 MiB、合计超过 2 MiB 的正文 spine 文件时，导入成功且分别成为章节；任一单章实际超过 2
      MiB 时仍返回 `EPUB_CHAPTER_TOO_LARGE`。
    result: passed
    reason:
      text: TestEPUBEmptyCoverTOCFallsBackToSpineAndKeepsPerChapterLimit checks two
        individually under-limit spine chapters whose combined Markdown exceeds
        2 MiB; TestEPUBChapterOver2MiBStillFails verifies EPUB_CHAPTER_TOO_LARGE
        remains enforced.
      truncated: false
  - id: A3
    source: brief.md
    text: 当有效目录从仅含章节标题的 spine
      文件开始且后续文件承载正文时，标题与后续正文保持同一章节；其他有效目录继续遵循章节边界、卷结构和跨文件范围，原有 EPUB 解析回归通过。
    result: passed
    reason:
      text: Regression tests cover a single heading-only chapter start followed by
        body text, a valid empty fragment anchor, nested cover targets, and
        existing TOC chapter and volume boundaries. The Runtime go test -race
        receipt passed and was reused.
      truncated: false
