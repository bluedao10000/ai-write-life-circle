acceptance:
  - id: A1
    source: brief.md
    text: "**A1 — Equal budget:** Given single-role and five-role plan checks for
      the same policy, Go reserves the existing single-role parent amount for
      either run; the five child limits sum exactly to it, and the five-role
      path does not increase the daily reservation. Unknown usage retains the
      full parent exposure."
    result: pending
    reason: null
  - id: A2
    source: brief.md
    text: "**A2 — Valid paired comparison:** Given development or held-out data, the
      runner accepts a pair only when both runs use the same case and saved
      revision, provider/model, deadline, and parent cap. It rejects mismatched
      or duplicate pairs and refuses development/held-out overlap."
    result: pending
    reason: null
  - id: A3
    source: brief.md
    text: "**A3 — Evidence-based quality report:** The report derives deterministic
      results and execution metrics from Go task receipts and persisted role
      results. It reports pairwise Judge and human agreement only for eligible
      labeled pairs, randomizes candidate order, records rubric/dataset/runtime
      versions, and leaves quality fields `null` when evidence is absent. A
      deterministic failure cannot be rescued by a Judge score."
    result: pending
    reason: null
  - id: A4
    source: brief.md
    text: "**A4 — Read-only authority and failure behavior:** Single- and multi-role
      runs keep the existing task authority, zero tool/write permissions,
      cancellation and no-retry policy, and no business or manuscript changes.
      Tests exercise provider failure and unknown usage using local synthetic
      providers."
    result: pending
    reason: null
  - id: A5
    source: brief.md
    text: "**A5 — No fabricated live evidence:** Automated development checks use
      localhost synthetic providers only. A remote Judge/evaluation path
      requires explicit synthetic-fixture and token-budget confirmation; this
      change does not execute it. Synthetic results are labeled as engineering
      evidence, and the five-role setting remains opt-in."
    result: pending
    reason: null
